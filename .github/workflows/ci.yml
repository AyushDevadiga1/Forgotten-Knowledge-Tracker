name: FKT CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install without the heavy extras that require system libs (tesseract, portaudio)
          pip install -r requirements.txt --no-deps || true
          pip install flask flask-wtf flask-cors flask-socketio python-dotenv sqlalchemy \
                      scikit-learn spacy yake hdbscan sentence-transformers pytest

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run database migrations
        run: python -m tracker_app.db.migrations
        env:
          PYTHONIOENCODING: utf-8

      - name: Run pytest
        run: pytest tracker_app/tests/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tracker_app/web/frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: tracker_app/web/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: tracker_app/web/frontend
        run: npx tsc --noEmit
