name: FKT CI

"on":
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Reduced Linux test set: only packages the test suite imports,
          # WITH their dependencies. Heavy runtime-only deps that need system
          # libs (tesseract, portaudio, opencv, mediapipe, librosa) or that are
          # only used by the live tracker loop (psutil, pynput) are excluded;
          # their modules load lazily and degrade gracefully when missing.
          pip install flask flask-wtf flask-cors flask-socketio python-dotenv \
                      sqlalchemy numpy networkx scikit-learn spacy yake pytest

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run database migrations
        run: python -m tracker_app.db.migrations
        env:
          PYTHONIOENCODING: utf-8

      - name: Run pytest
        run: pytest tracker_app/tests/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tracker_app/web/frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: tracker_app/web/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: tracker_app/web/frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: tracker_app/web/frontend
        run: npm run build
