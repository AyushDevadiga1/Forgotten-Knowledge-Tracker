name: FKT CI

"on":
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-wtf flask-cors flask-socketio flask-limiter \
                      python-dotenv sqlalchemy numpy networkx scikit-learn \
                      spacy yake pytest psutil filelock opencv-python pynput

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Create .env for testing
        run: |
          cat > .env << EOF
          SECRET_KEY=test-secret-key
          FLASK_ENV=testing
          DEBUG=False
          TRACK_INTERVAL=5
          SCREENSHOT_INTERVAL=20
          AUDIO_INTERVAL=15
          WEBCAM_INTERVAL=45
          RATELIMIT_ENABLED=false
          EOF

      - name: Run database migrations
        run: python -m tracker_app.db.migrations
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8

      - name: Run pytest
        run: pytest tracker_app/tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8


  lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check tracker_app/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check tracker_app/

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tracker_app/web/frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: tracker_app/web/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: tracker_app/web/frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: tracker_app/web/frontend
        run: npx vitest run

      - name: Production build
        working-directory: tracker_app/web/frontend
        run: npm run build