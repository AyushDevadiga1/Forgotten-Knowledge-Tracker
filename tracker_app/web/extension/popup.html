<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FKT Capture</title>
  <style>
    body { width: 260px; margin: 0; padding: 12px; font-family: system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { font-size: 12px; color: #555; margin: 4px 0 10px; }
    button { width: 100%; padding: 8px; font-size: 13px; border: 0; border-radius: 6px;
             background: #4f46e5; color: #fff; cursor: pointer; }
    button:disabled { background: #a5b4fc; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; min-height: 32px; white-space: pre-wrap; }
    label { display: block; font-size: 11px; color: #888; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; font-size: 11px; margin-top: 2px; padding: 3px; }
  </style>
</head>
<body>
  <h1>FKT Capture</h1>
  <p>Select study text in a tab, then click Capture.</p>
  <button id="capture">Capture selected text</button>
  <div id="status">Ready.</div>
  <label>Dashboard endpoint
    <input id="endpoint" type="text">
  </label>
  <script src="popup.js"></script>
</body>
</html>
